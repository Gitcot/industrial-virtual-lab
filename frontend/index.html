<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Industrial Virtual Lab - 3D Simulation</title>
  <style>
    /* Reset CSS de base */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Empêche les barres de défilement */
      background-color: #1a1d24;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* Conteneur du Canvas 3D (Three.js) */
    #app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Effets de survol et de clic sur les boutons HTML */
    button {
      transition: filter 0.2s ease, transform 0.1s ease;
    }
    button:hover:not([disabled]) {
      filter: brightness(1.2);
    }
    button:active:not([disabled]) {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  
  <!-- Conteneur pour le moteur 3D (Three.js) -->
  <div id="app"></div>

  <!-- Interface utilisateur superposée (Placée en bas à gauche) -->
  <div id="ui-layer" style="position: absolute; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; max-width: 350px;">
    
    <!-- En-tête et Statut -->
    <div style="background: rgba(26, 29, 36, 0.9); padding: 15px; border-radius: 8px; color: white; border-left: 4px solid #3498db; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
      <h2 style="margin: 0 0 5px 0; font-size: 1.2rem;">🏭 Jumeau Numérique 3D</h2>
      <p id="status" style="margin: 0; font-weight: bold; color: #f1c40f;">Connexion au serveur...</p>
    </div>

    <!-- Mode de Démarrage -->
    <div style="background: rgba(26, 29, 36, 0.9); padding: 15px; border-radius: 8px; border-left: 4px solid #9b59b6; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
      <h3 style="margin: 0 0 10px 0; color: #9b59b6; font-size: 1rem;">Mode de Démarrage</h3>
      <div style="display: flex; gap: 8px;">
        <button id="btn-mode-direct" style="flex: 1; background: #8e44ad; color: white; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">DIRECT</button>
        <button id="btn-mode-sd" style="flex: 1; background: #7f8c8d; color: white; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">AUTO Y/Δ</button>
      </div>
    </div>

    <!-- Boîte à bornes Moteur -->
    <div style="background: rgba(26, 29, 36, 0.9); padding: 15px; border-radius: 8px; border-left: 4px solid #f39c12; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
      <h3 style="margin: 0 0 10px 0; color: #f39c12; font-size: 1rem;">Couplage Manuel</h3>
      <button id="btn-cover" style="background: #34495e; color: white; padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 8px; width: 100%;">OUVRIR COUVERCLE</button>
      <div style="display: flex; gap: 8px;">
        <button id="btn-star" disabled style="flex: 1; background: #7f8c8d; color: white; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: not-allowed;">ÉTOILE (Y)</button>
        <button id="btn-delta" disabled style="flex: 1; background: #7f8c8d; color: white; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: not-allowed;">TRIANGLE (Δ)</button>
      </div>
    </div>

    <!-- Pupitre de commande -->
    <div style="background: rgba(26, 29, 36, 0.9); padding: 15px; border-radius: 8px; border-left: 4px solid #2ecc71; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
      <h3 style="margin: 0 0 10px 0; color: #2ecc71; font-size: 1rem;">Pupitre de Commande</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button id="btn-start" style="background: #27ae60; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">START (NO)</button>
        <button id="btn-stop" style="background: #c0392b; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">STOP (NC)</button>
        <button id="btn-trip" style="background: #e67e22; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">DÉFAUT</button>
        <button id="btn-reset" style="background: #2980b9; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">RÉARMER</button>
      </div>
    </div>
    
  </div>

  <!-- Script principal Vite/Three.js -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
