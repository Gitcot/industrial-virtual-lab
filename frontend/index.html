<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Industrial Virtual Lab - 3D Viewer</title>
  <style>
    /* Reset CSS pour que la 3D prenne tout l'écran sans marges */
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
    }

    #app {
      width: 100vw;
      height: 100vh;
    }

    #ui-layer {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
    }
  </style>
</head>

<body>
  <!-- Interface utilisateur superposée -->
  <!-- Interface utilisateur superposée -->
  <div id="ui-layer">
    <h2>🏭 Industrial Virtual Lab</h2>
    <p id="status">Connexion au serveur...</p>

    <!-- Pupitre de commande -->
    <div id="control-panel" style="margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.7); border-radius: 8px;">
      <h3 style="margin-top: 0;">Pupitre</h3>
      <button id="btn-start"
        style="background: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-right: 10px;">START
        (NO)</button>
      <button id="btn-stop"
        style="background: #c0392b; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">STOP
        (NC)</button>
    </div>
  </div>
  <!-- Conteneur 3D -->
  <div id="app"></div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
